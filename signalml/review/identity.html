<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Review</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1dc;
  --accent: #2f5fd0; --accent-ink: #ffffff; --ok: #2e7d4f; --warn: #b15c00; --bad: #b3261e;
  --chip: #efeee9; --focus: #dbe6ff; --guess: #8a8883;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9a94; --line: #34332f;
    --accent: #7ea2ff; --accent-ink: #0d1530; --ok: #6cc592; --warn: #f0a24a; --bad: #ff8a80;
    --chip: #2a2a27; --focus: #26324f; --guess: #8f8d87;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
.bar { flex: 1; max-width: 360px; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--ok); width: 0; transition: width .2s; }
.stat { color: var(--muted); font-variant-numeric: tabular-nums; }
header label { color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 49px); }
nav { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 49px); position: sticky; top: 49px; }
nav button { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; border: 0;
  background: none; color: var(--ink); padding: 7px 14px; cursor: pointer; font: inherit; }
nav button:hover { background: var(--chip); }
nav button.current { background: var(--focus); }
nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; transform: translateY(-1px); }
nav .done .dot { background: var(--ok); }
nav .warn .dot { background: var(--warn); }
nav .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav .name small { color: var(--muted); }
section.card { padding: 20px 28px 40px; max-width: 1100px; }
.card h2 { margin: 0; font-size: 22px; font-weight: 650; }
.card .sub { color: var(--muted); margin: 2px 0 18px; }
.row { display: grid; grid-template-columns: 190px 118px 124px 1fr; gap: 10px 14px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.row.focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row.double { margin-left: 28px; }
.row .t b { display: block; font-weight: 600; word-break: break-word; }
.row .t span { color: var(--muted); font-size: 12px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--chip); font-size: 12px; color: var(--muted); }
.snips, .seg { display: flex; gap: 4px; }
.snips button, .seg button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 7px; padding: 5px 0; width: 34px; cursor: pointer; font: inherit; font-variant-numeric: tabular-nums; }
.snips button.playing { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button.guess { border-style: dashed; color: var(--guess); }
.who { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.who input[type=text] { width: 210px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--panel); color: var(--ink); font: inherit; }
.who input.guess { color: var(--guess); font-style: italic; }
.flags { display: flex; flex-wrap: wrap; gap: 4px; }
.flags label, .same { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer;
  padding: 2px 7px; border-radius: 99px; background: var(--chip); }
.flags label.on { background: var(--warn); color: var(--panel); }
.alert { display: inline-block; margin-top: 3px; padding: 1px 7px; border-radius: 99px; font-size: 12px;
  background: var(--warn); color: var(--panel); }
.row.same-on .seg, .row.same-on input[type=text] { opacity: .45; pointer-events: none; }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 18px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 18px;
  font: inherit; font-weight: 600; cursor: pointer; }
.keys { color: var(--muted); font-size: 12px; }
kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel); }
.saved { color: var(--ok); }
.empty { padding: 60px 28px; color: var(--muted); }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  nav { position: static; max-height: 200px; border-right: 0; border-bottom: 1px solid var(--line); }
  .row { grid-template-columns: 1fr 1fr; }
  section.card { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>Voice review</h1>
  <div class="bar"><div id="bar"></div></div>
  <span class="stat" id="stat">loading…</span>
  <label><input type="checkbox" id="pending" checked> pending only</label>
  <label><input type="checkbox" id="autoplay" checked> autoplay</label>
</header>
<main>
  <nav id="list"></nav>
  <section class="card" id="card"><div class="empty">Loading the queue (the first load cuts snippets, a few seconds per track)…</div></section>
</main>
<audio id="player" preload="auto"></audio>
<script>
const $ = (s, el = document) => el.querySelector(s);
const player = $("#player");
let data = null, cur = 0, focus = 0, rows = [], playing = null;

async function load() {
  data = await (await fetch("/api/identity")).json();
  const first = data.cards.findIndex(c => !c.confirmed);
  cur = first >= 0 ? first : 0;
  renderList(); open(cur);
}

function visible() {
  const pendingOnly = $("#pending").checked;
  return data.cards.map((c, i) => [c, i]).filter(([c, i]) => !pendingOnly || !c.confirmed || i === cur);
}

function renderList() {
  const p = data.progress;
  $("#bar").style.width = (100 * p.confirmed / Math.max(1, p.songs)) + "%";
  $("#stat").textContent = `${p.confirmed} / ${p.songs} songs · ${p.labelled} / ${p.tracks} tracks`;
  const nav = $("#list"); nav.innerHTML = "";
  for (const [c, i] of visible()) {
    const b = document.createElement("button");
    b.className = (c.harsh_warning ? "warn " : c.confirmed ? "done " : "") + (i === cur ? "current" : "");
    if (c.harsh_warning) b.title = "a confirmed track here sounds harsh - worth a second listen";
    b.innerHTML = `<span class="dot"></span><span class="name">${esc(c.artist)} <small>— ${esc(c.song)}</small></span>`;
    b.onclick = () => open(i);
    nav.appendChild(b);
  }
}

function stateFor(t) {
  const L = t.label;
  const isDouble = !!t.lead_id;
  return {
    t, isDouble,
    gender: L ? L.gender : t.guess_gender, genderGuessed: !L,
    singer: L ? (L.singer || "") : t.guess_singer, singerGuessed: !L,
    flags: new Set(L ? [...L.flags, ...(L.recheck && t.harsh && t.harsh.likely && !L.harsh_seen ? ["harsh"] : [])]
                     : (t.harsh && t.harsh.likely ? ["harsh"] : [])),
    same: isDouble ? (L ? !!L.same_as_lead : true) : false,
  };
}

function open(i) {
  cur = i; stop();
  const c = data.cards[i];
  rows = c.tracks.map(stateFor); focus = 0;
  suggestSingers();
  const card = $("#card");
  card.innerHTML = `<h2>${esc(c.artist)}</h2>
    <div class="sub">${esc(c.song)} · ${c.tracks.length} main vocal track${c.tracks.length > 1 ? "s" : ""} · <span class="chip">${esc(c.batch)}</span></div>
    <datalist id="singers">${[...new Set([...c.known_singers, ...c.tracks.map(t => t.guess_singer)])]
      .map(s => `<option value="${esc(s)}">`).join("")}</datalist>
    <div id="rows"></div>
    <div class="actions"><button class="primary" id="confirm">Confirm &amp; next</button>
      <span id="msg"></span></div>
    <p class="keys"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> play · <kbd>Space</kbd> stop · <kbd>F</kbd>/<kbd>M</kbd>/<kbd>U</kbd> gender ·
      <kbd>↑</kbd><kbd>↓</kbd> track · <kbd>S</kbd> singer box · <kbd>Enter</kbd> confirm · <kbd>←</kbd><kbd>→</kbd> song</p>`;
  $("#confirm").onclick = confirm;
  drawRows(); renderList();
  if ($("#autoplay").checked && rows.length) play(0, 0);
}

function drawRows() {
  const box = $("#rows"); box.innerHTML = "";
  rows.forEach((r, k) => {
    const t = r.t, el = document.createElement("div");
    el.className = "row" + (r.isDouble ? " double" : "") + (k === focus ? " focus" : "") + (r.same ? " same-on" : "");
    const f0 = t.f0 ? `~${Math.round(t.f0)} Hz` : "no pitch";
    const h = t.harsh;
    const harshNote = h && h.likely
      ? (t.label && !t.label.flags.includes("harsh") && !t.label.harsh_seen
          ? `<br><span class="alert" title="measured: ${Math.round(100 * h.pitchless)}% of loud frames pitchless, median HNR ${h.hnr_median} dB">sounds harsh? re-check</span>`
          : `<br><span>harsh guess: ${Math.round(100 * h.pitchless)}% pitchless</span>`)
      : "";
    el.innerHTML = `
      <div class="t"><b>${esc(t.track)}</b><span class="chip">${esc(t.role.replace("_", " "))}</span> <span>${f0} · ${Math.round(t.sung_sec || 0)} s sung</span>${harshNote}</div>
      <div class="snips">${t.snippets.map((s, j) => `<button data-j="${j}" title="${s[0].toFixed(0)} s">${j + 1}</button>`).join("")}</div>
      <div class="seg">${["F", "M", null].map(g => `<button data-g="${g}" class="${r.gender === g ? (r.genderGuessed ? "on guess" : "on") : ""}">${g || "?"}</button>`).join("")}</div>
      <div class="who">
        <input type="text" list="singers" placeholder="singer" value="${esc(r.singer)}" class="${r.singerGuessed ? "guess" : ""}">
        ${r.isDouble ? `<label class="same"><input type="checkbox" ${r.same ? "checked" : ""}> same singer as lead</label>` : ""}
        <span class="flags">${Object.entries(data.flags).map(([f, title]) =>
          `<label title="${esc(title)}" class="${r.flags.has(f) ? "on" : ""}"><input type="checkbox" data-f="${f}" ${r.flags.has(f) ? "checked" : ""} hidden>${esc(f.replace("_", " "))}</label>`).join("")}</span>
      </div>`;
    el.onclick = () => { if (focus !== k) { focus = k; markFocus(); } };
    el.querySelectorAll(".snips button").forEach(b => b.onclick = e => { e.stopPropagation(); play(k, +b.dataset.j); });
    el.querySelectorAll(".seg button").forEach(b => b.onclick = () => setGender(k, b.dataset.g === "null" ? null : b.dataset.g));
    const inp = $("input[type=text]", el);
    inp.oninput = () => { r.singer = inp.value; r.singerGuessed = false; inp.classList.remove("guess"); };
    const same = $(".same input", el);
    if (same) same.onchange = () => { r.same = same.checked; drawRows(); };
    el.querySelectorAll(".flags input").forEach(cb => cb.onchange = () => {
      cb.checked ? r.flags.add(cb.dataset.f) : r.flags.delete(cb.dataset.f); drawRows(); });
    box.appendChild(el);
  });
}

function markFocus() { [...$("#rows").children].forEach((el, k) => el.classList.toggle("focus", k === focus)); }
function setGender(k, g) { rows[k].gender = g; rows[k].genderGuessed = false; suggestSingers(); drawRows(); }

// One singer per song unless it pairs a male and a female voice: untouched singer boxes
// follow the genders on screen, and the artist's earlier answers (a band already split
// into -f/-m stays split). `review apply` enforces the same rule across the whole artist.
function suggestSingers() {
  const c = data.cards[cur];
  const base = (c.artist || c.folder).toLowerCase();
  const own = rows.filter(r => !(r.isDouble && r.same)).map(r => r.gender).filter(Boolean);
  const split = new Set(own).size > 1 ||
    c.known_singers.some(s => s === base + "-f" || s === base + "-m");
  for (const r of rows)
    if (r.singerGuessed) r.singer = split && r.gender ? `${base}-${r.gender.toLowerCase()}` : base;
}

function play(k, j) {
  const t = rows[k].t, s = t.snippets[j];
  if (!s) return;
  focus = k; markFocus();
  player.src = `/audio/${t.id}?s=${s[0]}&d=${s[1]}`;
  player.play();
  playing = [k, j]; paintPlaying();
}
function stop() { player.pause(); playing = null; paintPlaying(); }
player.onended = () => { playing = null; paintPlaying(); };
function paintPlaying() {
  document.querySelectorAll(".snips button").forEach(b => b.classList.remove("playing"));
  if (!playing) return;
  const row = $("#rows") && $("#rows").children[playing[0]];
  if (row) row.querySelectorAll(".snips button")[playing[1]]?.classList.add("playing");
}

async function confirm() {
  const byId = Object.fromEntries(rows.map(r => [r.t.id, r]));
  const labels = rows.map(r => {
    const lead = r.same && r.t.lead_id ? byId[r.t.lead_id] : null;
    const src = lead || r;
    return { id: r.t.id, gender: src.gender, singer: (src.singer || "").trim() || null,
             flags: [...r.flags], same_as_lead: !!lead, harsh_seen: !!(r.t.harsh && r.t.harsh.likely) };
  });
  const res = await fetch("/api/identity/labels", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ labels }) });
  if (!res.ok) { $("#msg").textContent = "not saved: " + (await res.json()).error; return; }
  const c = data.cards[cur];
  const newly = c.tracks.filter(t => !t.label || t.label.recheck).length;
  c.tracks.forEach((t, k) => t.label = labels[k]);
  if (!c.confirmed) data.progress.confirmed++;
  data.progress.labelled += newly;
  c.confirmed = true;
  c.harsh_warning = false;  // every harsh measurement on this card was just in front of the reviewer
  const artist = c.artist;
  for (const card of data.cards) if (card.artist === artist)
    card.known_singers = [...new Set([...card.known_singers, ...labels.map(l => l.singer).filter(Boolean)])];
  const next = data.cards.findIndex((x, i) => i > cur && !x.confirmed);
  const wrap = data.cards.findIndex(x => !x.confirmed);
  open(next >= 0 ? next : wrap >= 0 ? wrap : cur);
  const m = $("#msg"); if (m) { m.className = "saved"; m.textContent = wrap < 0 ? "All songs confirmed." : "Saved."; }
}

document.addEventListener("keydown", e => {
  if (!data) return;
  const typing = e.target.tagName === "INPUT" && e.target.type === "text";
  if (e.key === "Enter") { e.preventDefault(); if (typing) e.target.blur(); confirm(); return; }
  if (typing) { if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if (k === "arrowdown" || k === "j") { focus = Math.min(rows.length - 1, focus + 1); markFocus(); }
  else if (k === "arrowup" || k === "k") { focus = Math.max(0, focus - 1); markFocus(); }
  else if (k === "arrowright") { const v = visible().map(x => x[1]); const n = v.find(i => i > cur); if (n !== undefined) open(n); }
  else if (k === "arrowleft") { const v = visible().map(x => x[1]).reverse(); const n = v.find(i => i < cur); if (n !== undefined) open(n); }
  else if (["1", "2", "3"].includes(k)) play(focus, +k - 1);
  else if (k === " ") { e.preventDefault(); playing ? stop() : play(focus, 0); }
  else if (k === "f") setGender(focus, "F");
  else if (k === "m") setGender(focus, "M");
  else if (k === "u") setGender(focus, null);
  else if (k === "s") { e.preventDefault(); $("#rows").children[focus]?.querySelector("input[type=text]")?.focus(); }
  else return;
});
$("#pending").onchange = renderList;

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
load().catch(err => { $("#card").innerHTML = `<div class="empty">Could not load the queue: ${esc(err)}</div>`; });
</script>
</body>
</html>
