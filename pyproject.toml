[project]
name = "signalml"
version = "0.1.0"
description = "Parametric, controllable singing/audio synthesis pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Logan Collier" }]
dependencies = [
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pydantic>=2.5",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "tqdm>=4.66",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# PyPI resolves CPU torch wheels on Windows. On the RTX 5090 training rig, swap in
# CUDA 12.8 wheels after sync (see README "GPU install"):
#   python -m uv pip install --upgrade torch torchaudio --index-url https://download.pytorch.org/whl/cu128
train = [
    "demucs>=4.0.1",
    "torch>=2.7",
    "torchaudio>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
signalml = "signalml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signalml"]

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
