[project]
name = "signalml"
version = "0.1.0"
description = "Parametric, controllable singing/audio synthesis pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Logan Collier" }]
dependencies = [
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# torch/demucs/etc. join in Migration P2+ as stages actually need them
# (RTX 5090 needs the CUDA 12.8 wheel index: https://download.pytorch.org/whl/cu128)
train = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
signalml = "signalml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signalml"]

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
