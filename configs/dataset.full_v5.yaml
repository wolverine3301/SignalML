# full_v5 (2026-10-09) - full_v4 plus the v5 data work. Built and trained on the rig.
#
# What changes against v4:
# - covers: the songs whose source was a 2020 Spleeter vocal (cut at 11 kHz) are
#   re-separated from their original mixes with Mel-RoFormer (configs/separate.roformer_mel.yaml,
#   the 2026-10-09 bake-off winner) and re-aligned.
# - every phrase alignment re-made with the planner fix (cuts only at real rests).
# - phrase gate: median phrase HNR >= 13 dB on separated audio (signalml quality).
# - dereverb: per-phrase de-reverbed audio for separated covers (signalml dereverb);
#   off here, the A/B recipes (dataset.full_v5ab_*.yaml) decide it.
# - gtsinger: the English tenor (EN-Tenor-1) joins the two altos (manual TextGrids).
# - ravdess: RAVDESS sung statements, 23 actors (12 M / 11 F), studio 48 kHz. Two fixed
#   sentences in six emotions: many voices, little lexical variety.
# - nus48e: NUS-48E sung takes, 12 singers (6 M / 6 F), manual phones; read takes are
#   domain=spoken, so `domain: sung` leaves them out.
# - vocadito is NOT in this recipe (consumer devices, no gender): eval material.
# - language stays en; GTSinger's other languages and M4Singer wait for a
#   multi-language run (DiffSinger language ids).
#
# Private overlay: configs/dataset.full_v5.local.yaml (gitignored): v4's exclusions plus
# a duplicate song and the Spleeter-era songs without an original mix.
#
#   signalml dataset build --recipe configs/dataset.full_v5.yaml
name: full_acoustic_v5
trainer: acoustic
profile: prod

filters:
  domain: sung
  language: en
  gender: null
  min_align_score: 0.5
  min_lyrics_agreement: 0.6
  exclude_processing: [heavy]
  corpora: []
  exclude_corpora: [vocadito]
  singers: []
  exclude_singers: []   # set in the .local.yaml overlay
  min_singer_minutes: 0.0
  ids: []
  exclude_ids: []       # set in the .local.yaml overlay

alignment_variant: phrase
phrase_gate:
  enabled: true
  drop_unsure_lyrics: false
  min_hnr_db: 13.0           # 2026-10-08 blind calibration (40/44 agreement)
  quality_scope: [separated]

dereverb:
  enabled: false             # the A/B recipes decide
  scope: [separated]

segmentation:
  split_gap_sec: 0.4
  min_clip_sec: 1.0
  max_clip_sec: 15.0
  pad_sec: 0.15
  inner_sp_min_sec: 0.05
  drop_noise_clips: true
  ph_num_mode: vowel_onset
  phone_merge: consonant_core

test_clips_per_speaker: 2

trainer_opts:
  # v4's 24 GB 4090 settings
  max_batch_frames: 20000
  max_batch_size: 32
  binarization_workers: 8
  max_updates: 160000
  num_ckpt_keep: 5
  permanent_ckpt_start: 10000
  permanent_ckpt_interval: 10000
