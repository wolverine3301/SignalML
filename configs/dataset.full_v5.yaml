# DRAFT (2026-10-09) - full_v4 plus the public corpora onboarded on branch
# public-singing-datasets. Not built or trained yet; the corpora below must be imported
# and processed on the rig first (import commands + rig steps are in the run notes).
#
# What changes against v4:
# - gtsinger: the English tenor (EN-Tenor-1) joins the two altos -
#   `signalml manifest import-gtsinger --genders M`. Manual TextGrid alignments, no MFA.
# - ravdess: RAVDESS sung statements, 23 actors (12 M / 11 F), studio, 48 kHz.
#   Two fixed sentences in six emotions - small (~1.3 h of file time), many voices.
#   Lyrics from the file codes; Whisper -> lyrics --resolve -> align --phrases as usual.
# - nus48e: NUS-48E sung takes, 12 singers (6 M / 6 F per the paper), manual phone
#   labels, no MFA. Gender must be set by review first (the corpus files lack it).
#   Its read takes are domain=spoken, so the `domain: sung` filter leaves them out.
# - vocadito is NOT in this recipe: consumer-device recordings (source_quality unset),
#   no gender. It is evaluation / note-label material.
# - language stays en. GTSinger's other eight languages (phone + note labels, 48 kHz)
#   and M4Singer (Mandarin) are downloaded but need a multi-language recipe
#   (DiffSinger language ids) - a separate decision, not part of this draft.
# - phrase gate: when branch phrase-quality-gate is merged, add
#     phrase_gate: {min_hnr_db: 13, quality_scope: [separated]}
#   (left out here because this branch's recipe loader does not know those keys yet).
#
# Corpora: all of them, like v4 (a development run).
#
# Private overlay: configs/dataset.full_v5.local.yaml (gitignored) - copy v4's overlay
# (exclude_singers, exclude_ids) and extend it.
#
#   signalml dataset build --recipe configs/dataset.full_v5.yaml
name: full_acoustic_v5
trainer: acoustic
profile: prod

filters:
  domain: sung
  language: en
  gender: null
  min_align_score: 0.5
  min_lyrics_agreement: 0.6
  exclude_processing: [heavy]
  corpora: []
  exclude_corpora: [vocadito]
  singers: []
  exclude_singers: []   # set in the .local.yaml overlay
  min_singer_minutes: 0.0
  ids: []
  exclude_ids: []       # set in the .local.yaml overlay

alignment_variant: phrase
phrase_gate:
  enabled: true
  drop_unsure_lyrics: false

segmentation:
  split_gap_sec: 0.4
  min_clip_sec: 1.0
  max_clip_sec: 15.0
  pad_sec: 0.15
  inner_sp_min_sec: 0.05
  drop_noise_clips: true
  ph_num_mode: vowel_onset
  phone_merge: consonant_core

test_clips_per_speaker: 2

trainer_opts:
  # v4's 24 GB 4090 settings
  max_batch_frames: 20000
  max_batch_size: 32
  binarization_workers: 8
  max_updates: 160000
  num_ckpt_keep: 5
  permanent_ckpt_start: 10000
  permanent_ckpt_interval: 10000
