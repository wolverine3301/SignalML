# The first real multi-singer acoustic run (MIGRATION_PLAN P7.6).
#
# The minimum-minutes speaker floor is OFF. It exists to protect the voice bank - an
# embedding fitted on two minutes renders as the corpus average, and the ECAPA novelty
# guard has nothing real to measure a sampled voice against - but that is a property of
# *sampling*, not of training: small speakers cost little in backbone quality and the
# backbone gets the extra audio. So: train on everyone, and apply the floor when the
# voice bank picks which spk embeddings to sample from (see OPEN_QUESTIONS).
#
# Private overlay: configs/dataset.full_v2.local.yaml (gitignored) sets
# filters.exclude_singers - tags that are not one female voice.
#
#   signalml dataset build --recipe configs/dataset.full_v2.yaml
name: full_acoustic_v2
trainer: acoustic
profile: prod

filters:
  domain: sung
  language: en
  gender: F
  min_align_score: 0.8
  exclude_processing: [heavy]
  corpora: []
  exclude_corpora: []
  singers: []
  exclude_singers: []   # set in the .local.yaml overlay
  min_singer_minutes: 0.0   # off - see header; the floor belongs to voice-bank sampling
  ids: []

segmentation:
  split_gap_sec: 0.4
  min_clip_sec: 2.0
  max_clip_sec: 15.0
  pad_sec: 0.15
  inner_sp_min_sec: 0.05
  drop_noise_clips: true
  # one ph_num group per sung note - what the variance model reads at inference
  ph_num_mode: vowel_onset

test_clips_per_speaker: 2

trainer_opts:
  # Frames, not seconds. Measured on the 24 GB 4090 (2026-09-25): 50000/48 filled VRAM,
  # spilled to system RAM and ran at 0.10 steps/s; 20000/32 uses ~21 GB and settles at
  # ~6.4 steps/s after the first epochs (early epochs are slow while cuDNN tunes for
  # new batch shapes - judge speed from epoch 3 on, not the first minutes).
  max_batch_frames: 20000
  max_batch_size: 32
  binarization_workers: 8
  num_ckpt_keep: 5              # rolling, for resume
  # ~850 MB each: a checkpoint every 10k steps across a 160k run is ~13 GB, which is
  # the price of being able to go back to the step that sounded best.
  permanent_ckpt_start: 10000
  permanent_ckpt_interval: 10000
