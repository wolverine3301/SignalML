# The first real multi-singer acoustic run (MIGRATION_PLAN P7.6).
#
# 2026-09-24: the 5-minute speaker floor is OFF. It dropped most speakers and a
# third of the audio (N h -> N h) to protect the voice bank - an embedding fitted
# on two minutes renders as the corpus average, and the ECAPA novelty guard has nothing
# real to measure a sampled voice against. But that is a property of *sampling*, not of
# training: small speakers cost little in backbone quality and the backbone gets 50% more
# audio. So: train on everyone, and apply the floor when the voice bank picks which
# spk embeddings to sample from (not yet enforced there - see OPEN_QUESTIONS).
#
# exclude_singers: tags that are not one female voice. Their songs are male leads or
# duets with a male singer, filed under a female-filtered name.
#
#   signalml dataset build --recipe configs/dataset.full_v2.yaml
name: full_acoustic_v2
trainer: acoustic
profile: prod

filters:
  domain: sung
  language: en
  gender: F
  min_align_score: 0.8
  exclude_processing: [heavy]
  corpora: []
  exclude_corpora: []
  singers: []
  exclude_singers:
    - singer   # artist original - male lead
    - singer       # artist "a song" original - male lead
    - singer          # artist track, vocalist unconfirmed
    - singer              # duet with a male singer
    - singer             # a duet
  min_singer_minutes: 0.0   # off - see header; the floor belongs to voice-bank sampling
  ids: []

segmentation:
  split_gap_sec: 0.4
  min_clip_sec: 2.0
  max_clip_sec: 15.0
  pad_sec: 0.15
  inner_sp_min_sec: 0.05
  drop_noise_clips: true

test_clips_per_speaker: 2

trainer_opts:
  # Frames, not seconds: at prod (44.1 kHz / hop 512) 50000 frames is ~9.7 min of audio
  # per step. Their acoustic template's default, and a reasonable middle for a real
  # multi-singer run on the 24 GB rig - 80000/64 measured at 24 GB used and 0.26
  # steps/s there, which is too close to the edge and too few updates per hour.
  # Halve max_batch_frames first if it OOMs.
  max_batch_frames: 50000
  max_batch_size: 48
  binarization_workers: 8
  num_ckpt_keep: 5              # rolling, for resume
  # ~850 MB each: a checkpoint every 10k steps across a 160k run is ~13 GB, which is
  # the price of being able to go back to the step that sounded best.
  permanent_ckpt_start: 10000
  permanent_ckpt_interval: 10000
