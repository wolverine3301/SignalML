# S6b dataset recipe (docs/PIPELINE_AND_CONTRACTS.md §S6b; docs/notes/vendor_diffsinger.md).
# A dataset is a pure function of the manifest + this recipe — tags filter, they
# never delete. Rebuild with `signalml dataset build --force` after edits.
name: full_acoustic_v1
trainer: acoustic          # variance blocked on DECISION_POINTS D1 (note labels)
profile: prod              # clips must come from clean/ at this profile (Q11)

filters:
  domain: sung
  language: en
  gender: F
  min_align_score: 0.8
  exclude_processing: [heavy]   # tag via META.txt PROCESSING: + `manifest retag`
  corpora: []                   # empty = every corpus; e.g. [vocalset, gtsinger]
  exclude_corpora: []           # e.g. [medleydb] to keep a corpus out of this run
  singers: []                   # empty = all
  # Speakers under this many minutes of CLIPPED audio are dropped whole (0 = keep
  # all). Clip time runs ~56% of raw duration, so 5 raw minutes is under 3 here.
  min_singer_minutes: 0.0
  ids: []                       # optional explicit whitelist

segmentation:
  split_gap_sec: 0.4       # a silence gap this long ends a clip
  min_clip_sec: 2.0
  max_clip_sec: 15.0
  pad_sec: 0.15
  inner_sp_min_sec: 0.05   # smaller gaps merge into the neighboring phone
  drop_noise_clips: true   # clips containing spn (alignment holes) are excluded

test_clips_per_speaker: 2

# Machine-shaped knobs for the generated trainer config (never data or audio: the
# mel contract comes from the profile, and `extra` refuses those keys, D5).
# These defaults fit an 8 GB card; the rig recipes raise them.
trainer_opts:
  max_batch_frames: 30000   # their acoustic template: 50000
  max_batch_size: 16        # their acoustic template: 64
  binarization_workers: 4
  pe: parselmouth           # rmvpe is a quality upgrade, needs its own checkpoint
  # CC BY-NC community checkpoint: dev preview only (Q4), path is relative to
  # third_party/DiffSinger. val_with_vocoder: null = auto (on at prod, off at dev).
  vocoder: NsfHifiGAN
  vocoder_ckpt: checkpoints/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/model.ckpt
  val_with_vocoder: null
  max_updates: null         # null = whatever the vendored config says (160000)
  val_check_interval: null
  num_ckpt_keep: null
  extra: {}                 # any other vendored-trainer key, merged last
